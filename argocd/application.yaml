apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: express-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/levi-dev-stack/express-k8s.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default
